<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="icon" type="image/png" href="digbyflamingofavicon.png" />

  <!--  make sure the Inter web-font loads before first paint  -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />

  <title>DIGBY</title>

  <!-- Google Analytics (unchanged) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JL3X2414G2"></script>
  <script>
    window.dataLayer = [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date()); gtag('config', 'G-JL3X2414G2');
  </script>

  <style>
    :root{
      --blue:#4285f4; --navy:#2c3e50; --orange:#e95800; --violet:#6c5ce7; --bg:#f2f2f2;
    }

    /* —— layout —— */
    body{
      font-family:"Inter",sans-serif;
      display:flex;justify-content:center;align-items:flex-start;
      min-height:100vh;margin:0;background:var(--bg);overflow-x:hidden;
      padding:40px 0;
    }
    .search-container{text-align:center;width:100%;}

    .search-box,.search-box:focus{
      width:500px;max-width:90%;box-sizing:border-box;
      padding:12px 22px;border:1px solid #ddd;border-radius:28px;
      font-size:16px;line-height:1.4;resize:vertical;max-height:260px;
      font-family:"Inter",Arial,Helvetica,sans-serif;
    }
    .search-box::placeholder{letter-spacing:.1px;}

    .buttons-container{display:flex;justify-content:center;gap:28px;margin-top:26px;}

    .logo{max-width:300px;margin:0 auto;display:block;transition:transform .5s linear;}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .logo.spin{animation:spin 2s linear infinite;}

    .tagline{font-size:14px;color:#555;margin:6px auto 0;max-width:500px;}
    .tagline b{color:var(--navy);}

    .response-wrapper{position:relative;display:inline-block;}
    .response{
      margin-top:22px;font-size:16px;color:#333;text-align:left;white-space:pre-wrap;
      max-height:300px;overflow-y:auto;width:500px;max-width:90%;
      border:1px solid #ddd;border-radius:12px;padding:16px 20px;
      background:#fff;box-shadow:0 0 10px rgba(0,0,0,.1);
      transition:transform .25s;
    }
    .response strong{font-weight:700;}
    .response del{background:#ffe3e3;color:#c0392b;border-radius:3px;}
    .response ins{background:#e3ffe8;color:#1e7e34;text-decoration:none;border-radius:3px;}
    @keyframes boomPop{
      0%{transform:scale(.5) rotate(-6deg);}
      30%{transform:scale(1.15) rotate(3deg);}
      60%{transform:scale(.98) rotate(-2deg);}
      100%{transform:scale(1) rotate(0);}
    }
    .response.boom{animation:boomPop .75s ease-out;}

    .copy-btn{
      position:absolute;top:8px;right:8px;background:transparent;border:none;
      cursor:pointer;font-size:18px;opacity:.6;
    }
    .copy-btn:hover{opacity:1;}

    .result-bar{display:none;justify-content:center;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap;}
    .mini-btn{
      border:1px solid #ccc;background:#fff;border-radius:16px;padding:6px 14px;
      font-size:13px;cursor:pointer;font-family:"Inter",sans-serif;transition:background .15s,border-color .15s;
    }
    .mini-btn:hover{border-color:var(--navy);}
    .mini-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}

    .fluff{font-size:14px;color:#666;margin-top:8px;text-align:center;}
    .nudge{
      font-size:14px;color:#8a5a00;margin:12px auto 0;max-width:500px;text-align:left;
      background:#fff7e6;border:1px solid #ffe2a8;border-radius:12px;padding:10px 16px;display:none;
    }
    .nudge b{color:#b06a00;}
    .edit-note{font-size:12px;color:#666;margin-top:14px;}
    .warning{color:red;font-size:14px;margin-top:10px;}

    /* —— modal —— */
    .modal{display:none;position:fixed;inset:0;z-index:2;background:rgba(0,0,0,.45);
           justify-content:center;align-items:center;padding:20px;box-sizing:border-box;}
    .modal-content{
      background:#fff;padding:22px 26px;border-radius:18px;
      box-shadow:0 10px 28px rgba(0,0,0,.25);text-align:center;
      width:620px;max-width:100%;max-height:88vh;overflow-y:auto;
    }
    .modal-content h3{margin:0 0 4px;}
    .modal-sub{font-size:13px;color:#666;margin:0 0 16px;}

    .filter-box{
      width:100%;box-sizing:border-box;padding:10px 16px;border:1px solid #ddd;
      border-radius:22px;font-size:14px;margin-bottom:14px;font-family:"Inter",sans-serif;
    }

    .group{margin-bottom:14px;text-align:left;}
    .group-label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#999;margin:0 0 8px 2px;}
    .chips{display:flex;flex-wrap:wrap;gap:8px;}
    .chip{
      border:1px solid #ddd;background:#fafafa;border-radius:20px;padding:8px 14px;
      font-size:14px;cursor:pointer;font-family:"Inter",sans-serif;transition:all .14s;
      border-left:4px solid var(--c,#bbb);
    }
    .chip:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.12);}
    .chip.sel{background:var(--c,#333);color:#fff;border-color:var(--c,#333);}

    .custom-wrap{display:none;margin:8px 0 16px;text-align:left;}
    .custom-wrap input{
      width:100%;box-sizing:border-box;padding:10px 16px;border:1px solid #ddd;
      border-radius:22px;font-size:14px;font-family:"Inter",sans-serif;
    }

    .intensity-wrap{text-align:left;margin:16px 2px 10px;}
    .intensity-wrap label{font-size:12px;color:#777;}
    .seg{display:flex;gap:8px;margin-top:6px;}
    .seg button{
      flex:1;padding:8px 0;border:1px solid #ddd;background:#fafafa;border-radius:14px;
      font-size:13px;cursor:pointer;font-family:"Inter",sans-serif;transition:all .14s;
    }
    .seg button.on{background:var(--navy);color:#fff;border-color:var(--navy);}

    .go-btn{
      margin-top:16px;padding:16px 40px;font-size:17px;border-radius:40px;border:none;color:#fff;
      cursor:pointer;background:var(--blue);letter-spacing:.3px;
      background-image:radial-gradient(160% 160% at 25% 25%,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 55%);
      box-shadow:8px 8px 18px rgba(0,0,0,.24),-8px -8px 18px rgba(255,255,255,.9);
      transition:box-shadow .18s,transform .18s;
    }
    .go-btn:hover{transform:translateY(-2px);}
    .go-btn:active{transform:scale(.94);}
    .go-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

    .search-btn{
      --btn:#4285f4;
      padding:22px 48px;font-size:18px;border-radius:50px;border:none;
      color:#fff;cursor:pointer;letter-spacing:.35px;background:var(--btn);
      background-image:radial-gradient(160% 160% at 25% 25%,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 55%);
      box-shadow:10px 10px 22px rgba(0,0,0,.28),-10px -10px 22px rgba(255,255,255,.9);
      transition:box-shadow .18s,transform .18s;
    }
    .search-btn:hover{
      box-shadow:14px 14px 26px rgba(0,0,0,.32),-14px -14px 26px rgba(255,255,255,.95);
      transform:translateY(-3px);
    }
    .search-btn:active{
      box-shadow:inset 8px 8px 14px rgba(0,0,0,.28),inset -8px -8px 14px rgba(255,255,255,.92);
      transform:scale(.93);
    }

    /* —— burst ring & body shake —— */
    @keyframes boomRing{
      0%{transform:translate(-50%,-50%) scale(.2);opacity:.8;}
      100%{transform:translate(-50%,-50%) scale(2.8);opacity:0;}
    }
    body::before{
      content:'';position:fixed;top:50%;left:50%;width:300px;height:300px;border-radius:50%;
      pointer-events:none;opacity:0;background:radial-gradient(circle,var(--burst,#4285f4) 0%,rgba(66,133,244,0) 70%);
    }
    body.burst::before{animation:boomRing .75s ease-out;}
    @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,4px)}}
    body.burst{animation:shake .75s linear;}

    /* —— confetti —— */
    @keyframes confettiFall{
      0%{transform:translateY(0) rotate(0deg);opacity:1;}
      100%{transform:translateY(600px) rotate(720deg);opacity:0;}
    }
    .confetti{
      position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;
      background:var(--c);pointer-events:none;z-index:9999;
      animation:confettiFall 1.2s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <img src="digbyflamingo.png" alt="DIGBY Logo" class="logo" id="logo" />

    <textarea class="search-box" rows="7" placeholder="Paste your writing here, then DIGBY it..."></textarea>
    <p class="tagline">DIGBY <b>edits</b>. You <b>write</b>. Sharpen your own prose through a lens, don't hand it over.</p>
    <div class="warning" id="warning" style="display:none;">Please enter no more than 20&nbsp;000 words.</div>

    <div class="buttons-container">
      <button class="search-btn" onclick="prepDigby()">DIGBY it</button>
    </div>

    <div class="response-wrapper">
      <button class="copy-btn" id="copyBtn" title="Copy to clipboard" style="display:none;">📦</button>
      <div class="response" id="response"></div>
    </div>
    <div class="result-bar" id="resultBar">
      <button class="mini-btn" id="diffBtn" onclick="toggleDiff()">👀 Show edits</button>
      <span class="fluff" id="fluffMeter" style="margin-top:0;"></span>
    </div>
    <div class="nudge" id="nudge"></div>

    <div class="edit-note">Always edit what Digby gives you. Writing is rewriting. 😉</div>
  </div>

  <!-- style / options picker -->
  <div id="styleModal" class="modal">
    <div class="modal-content">
      <h3>pick a lens</h3>
      <p class="modal-sub">DIGBY edits your words through it. It won't write for you.</p>
      <input class="filter-box" id="filterBox" placeholder="filter styles... (try 'joyce', 'cozy', 'crime')" oninput="renderChips(this.value)" />
      <div id="chipArea"></div>

      <div class="custom-wrap" id="customWrap">
        <input id="customVoice" placeholder="describe any voice: 'a tired noir detective', 'my grandmother', 'a weather report'..." />
      </div>

      <div class="intensity-wrap">
        <label>intensity</label>
        <div class="seg" id="intensitySeg">
          <button data-i="light"  onclick="setIntensity('light',this)">light</button>
          <button data-i="medium" class="on" onclick="setIntensity('medium',this)">medium</button>
          <button data-i="savage" onclick="setIntensity('savage',this)">savage</button>
        </div>
      </div>

      <button class="go-btn" id="goBtn" onclick="go()" disabled>pick a lens first</button>
    </div>
  </div>

<script>
/* —— helpers —— */
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const countWords=s=>s.trim().split(/\s+/).length;

/* —— the curated lens menu (ids MUST match worker STYLES keys) —— */
const MENU=[
  {group:'Cut it down', color:'#2c3e50', items:[
    ['lish','🪒 Lish'],['hemingway','🧊 Hemingway'],['elmore-leonard','🔫 Elmore Leonard'],['beckett','🕳️ Beckett']]},
  {group:'Let it sing', color:'#6c5ce7', items:[
    ['gatsby','🎩 Gatsby'],['donna-tartt','🏛️ Donna Tartt'],['mccarthy','🩸 McCarthy'],['murakami','🐈 Murakami'],
    ['sylvia-plath','🖤 Sylvia Plath'],['george-eliot','🪶 George Eliot'],['colson-whitehead','🧭 Colson Whitehead']]},
  {group:'Break the form', color:'#00a3a3', items:[
    ['dfw','♾️ David Foster Wallace'],['joyce-ulysses','🌀 Joyce (Ulysses)'],['joyce-wake','💤 Joyce (Finnegans Wake)'],['charlie-kaufman','🪞 Charlie Kaufman']]},
  {group:'Stage & screen', color:'#c0392b', items:[
    ['arthur-miller','🎭 Arthur Miller'],['sam-shepard','🌵 Sam Shepard'],['rod-serling','📺 Rod Serling'],['spike-lee','🎬 Spike Lee'],['chuck-jones','💥 Chuck Jones']]},
  {group:'Get the story', color:'#e95800', items:[
    ['gonzo','🦇 Gonzo'],['susan-orlean','🌺 Susan Orlean'],['jimmy-breslin','🗞️ Jimmy Breslin']]},
  {group:'Heart on sleeve', color:'#e84393', items:[
    ['danielle-steel','💎 Danielle Steel'],['bronte','🌧️ Brontë'],['hallmark','🎄 Hallmark']]},
  {group:'Just fix it', color:'#2d8a4e', items:[
    ['plain','🧼 Plain English'],['corporate','🧟 Corporate Killer']]},
  {group:'Your call', color:'#4285f4', items:[
    ['custom','✨ Custom voice']]}
];
const COLOR={}; MENU.forEach(g=>g.items.forEach(([id])=>COLOR[id]=g.color));

let selStyle=null, selIntensity='medium', lastQuery='', lastInput='', lastOutput='', diffOn=false;

/* —— render the chip menu (with optional filter) —— */
function renderChips(filter=''){
  const f=filter.trim().toLowerCase();
  const area=$('chipArea'); area.innerHTML='';
  MENU.forEach(g=>{
    const items=g.items.filter(([id,name])=>!f||name.toLowerCase().includes(f)||id.includes(f));
    if(!items.length) return;
    const wrap=document.createElement('div'); wrap.className='group';
    const lbl=document.createElement('p'); lbl.className='group-label'; lbl.textContent=g.group; wrap.appendChild(lbl);
    const chips=document.createElement('div'); chips.className='chips';
    items.forEach(([id,name])=>{
      const b=document.createElement('button');
      b.className='chip'+(id===selStyle?' sel':''); b.textContent=name;
      b.style.setProperty('--c',g.color);
      b.onclick=()=>selectStyle(id);
      chips.appendChild(b);
    });
    wrap.appendChild(chips); area.appendChild(wrap);
  });
}
function selectStyle(id){
  selStyle=id;
  $('customWrap').style.display = id==='custom' ? 'block' : 'none';
  renderChips($('filterBox').value);
  const go=$('goBtn'); go.disabled=false; go.textContent='DIGBY it';
  if(id==='custom') setTimeout(()=>$('customVoice').focus(),50);
}
function setIntensity(i,btn){
  selIntensity=i;
  [...$('intensitySeg').children].forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

/* —— flow —— */
function prepDigby(){
  lastQuery=document.querySelector('.search-box').value.trim();
  if(!lastQuery){alert('Paste some writing first.');return;}
  if(countWords(lastQuery)>20000){$('warning').style.display='block';return;}
  $('warning').style.display='none';
  selStyle=null; $('goBtn').disabled=true; $('goBtn').textContent='pick a lens first';
  $('customWrap').style.display='none'; $('filterBox').value='';
  renderChips();
  $('styleModal').style.display='flex';
}
async function go(){
  if(!selStyle) return;
  const customVoice = selStyle==='custom' ? $('customVoice').value.trim() : '';
  if(selStyle==='custom' && !customVoice){alert('Describe a voice, or pick a lens.');return;}
  $('styleModal').style.display='none';
  await submitQuery(selStyle, selIntensity, customVoice);
}

/* —— burst / confetti —— */
function triggerBurst(style){
  const c=COLOR[style]||'#4285f4';
  document.body.style.setProperty('--burst',c);
  document.body.classList.add('burst');
  setTimeout(()=>document.body.classList.remove('burst'),750);
  for(let i=0;i<25;i++){
    const el=document.createElement('span'); el.className='confetti';
    el.style.setProperty('--c',c);
    el.style.left=Math.random()*100+'vw';
    el.style.transform=`scale(${0.8+Math.random()*0.6})`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1200);
  }
}

const ANALYZE_URL='https://digby-analyze.kevin-murawinski.workers.dev/';

async function submitQuery(style, intensity, customVoice){
  const logo=$('logo'),resp=$('response'),fluff=$('fluffMeter');
  if(!lastQuery){alert('Paste some writing first.');return;}
  try{
    logo.classList.add('spin'); triggerBurst(style);
    const r=await fetch(ANALYZE_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:lastQuery,style,intensity,customVoice})
    });
    if(!r.ok) throw new Error('Network error');
    const data=await r.json();
    if(data.error) throw new Error(data.error);

    lastInput=lastQuery; lastOutput=data.transformedText; diffOn=false;

    resp.classList.remove('boom'); void resp.offsetWidth;
    renderResponse();
    resp.classList.add('boom');

    $('resultBar').style.display='flex';
    $('diffBtn').classList.remove('on'); $('diffBtn').textContent='👀 Show edits';
    fluff.innerText=data.fluff!==undefined?`💭 Fluff cut: ${data.fluff}%`:'';

    const nudge=$('nudge');
    if(data.note){ nudge.style.display='block'; nudge.innerHTML='<b>Digby’s nudge:</b> '+esc(data.note); }
    else nudge.style.display='none';

    const copyBtn=$('copyBtn'); copyBtn.style.display='block'; copyBtn.innerText='📦';
    copyBtn.onclick=async()=>{
      try{await navigator.clipboard.writeText(lastOutput);
           copyBtn.innerText='✅'; setTimeout(()=>copyBtn.innerText='📦',1500);}
      catch{copyBtn.innerText='❌';}
    };
  }catch(e){resp.innerText=`Error: ${e.message}`;}
  finally{logo.classList.remove('spin');}
}

function renderResponse(){
  const resp=$('response');
  if(diffOn){
    resp.innerHTML='<strong>What Digby changed:</strong><br><br>'+wordDiff(lastInput,lastOutput);
  }else{
    resp.innerHTML='<strong>Digby edited it like this:</strong><br><br>'+esc(lastOutput).replace(/\n/g,'<br>');
  }
}
function toggleDiff(){
  // Diff is O(n*m); guard against giant inputs.
  if(!diffOn && (countWords(lastInput)>2500 || countWords(lastOutput)>2500)){
    alert('Diff view is off for very long passages. The edited text is still here.');
    return;
  }
  diffOn=!diffOn;
  $('diffBtn').classList.toggle('on',diffOn);
  $('diffBtn').textContent=diffOn?'📝 Show result':'👀 Show edits';
  renderResponse();
}

/* —— word-level diff (LCS), strikethrough cuts + highlight additions —— */
function wordDiff(a,b){
  const A=a.split(/(\s+)/), B=b.split(/(\s+)/);
  const n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out='';
  const del=t=>t.trim()?`<del>${esc(t)}</del>`:esc(t);
  const ins=t=>t.trim()?`<ins>${esc(t)}</ins>`:esc(t);
  while(i<n&&j<m){
    if(A[i]===B[j]){out+=esc(A[i]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out+=del(A[i]);i++;}
    else{out+=ins(B[j]);j++;}
  }
  while(i<n){out+=del(A[i]);i++;}
  while(j<m){out+=ins(B[j]);j++;}
  return out.replace(/\n/g,'<br>');
}

window.onclick=e=>{ if(e.target===$('styleModal')) $('styleModal').style.display='none'; };
</script>
</body>
</html>
